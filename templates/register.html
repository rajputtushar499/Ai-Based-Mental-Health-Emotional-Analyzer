{% extends "base.html" %}
{% block title %}Create account - Emotion Analyzer{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="card-x auth-card">
    <h1 class="h3">Create your account</h1>
    <p class="text-muted">Your password is stored only as a salted hash.</p>
    <form id="register-form" novalidate>
      <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" type="text" maxlength="80" autocomplete="name" required></div>
      <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" type="email" autocomplete="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" autocomplete="new-password" required aria-describedby="pw-help"><div id="pw-help" class="form-text">At least 8 characters, with a letter and a number.</div></div>
      <div id="form-error" class="alert alert-danger d-none" role="alert"></div>
      <button class="btn btn-primary-x w-100" type="submit">Create account</button>
    </form>
    <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login_page') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
