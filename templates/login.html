{% extends "base.html" %}
{% block title %}Log in - Emotion Analyzer{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="card-x auth-card">
    <h1 class="h3">Welcome back</h1>
    <p class="text-muted">Log in to see your dashboard and analyze new entries.</p>
    <form id="login-form" novalidate>
      <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" type="email" autocomplete="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
      <div id="form-error" class="alert alert-danger d-none" role="alert"></div>
      <button class="btn btn-primary-x w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 mb-0 small">New here? <a href="{{ url_for('auth.register_page') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
